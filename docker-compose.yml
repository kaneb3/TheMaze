services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lantern
      POSTGRES_PASSWORD: lantern
      POSTGRES_DB: lantern
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lantern -d lantern']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
