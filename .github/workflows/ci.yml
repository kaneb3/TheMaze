name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lantern
          POSTGRES_PASSWORD: lantern
          POSTGRES_DB: lantern
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lantern -d lantern"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://lantern:lantern@localhost:5432/lantern
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Migrations against a real Postgres
        run: npm run migrate && npm run migrate
